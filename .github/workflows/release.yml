name: Publish APK release
on:
  push:
    branches: [main]
    paths: ['apk/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode APK
        run: |
          base64 -d apk/CleanYourTV-Shrine.apk.b64 > CleanYourTV-Shrine.apk
          echo "$(cat apk/SHA256)  CleanYourTV-Shrine.apk" | sha256sum -c
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(cat apk/TAG)
          TITLE=$(cat apk/TITLE)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CleanYourTV-Shrine.apk --clobber
            gh release edit "$TAG" --notes-file apk/NOTES.md --latest
          else
            gh release create "$TAG" CleanYourTV-Shrine.apk --title "$TITLE" --notes-file apk/NOTES.md --latest
          fi
